# Local, production-like stack: docker compose up --build  ->  http://localhost:4000
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: ['mongo-data:/data/db']
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ ping: 1 })']
      interval: 5s
      retries: 20
  app:
    build: .
    depends_on:
      mongo:
        condition: service_healthy
    ports: ['4000:4000']
    environment:
      MONGODB_URI: mongodb://mongo:27017/jky_radar
      SESSION_SECRET: ${SESSION_SECRET:-change-me-docker-compose-secret-0123456789}
      WEB_ORIGIN: http://localhost:4000
      API_ORIGIN: http://localhost:4000
      NODE_ENV: development # set to production behind HTTPS so cookies are Secure
      DEMO_SEED_ENABLED: 'true'
volumes:
  mongo-data:
