<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="JKY-Radar compares two versions of an API contract and tells you which changes break existing clients, why, and who depends on them."
    />
    <meta name="theme-color" content="#0F1217" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>JKY-Radar — Know what breaks before you ship</title>
    <script>
      try {
        var t = localStorage.getItem('jky-theme');
        var dark = t ? t === 'dark' : !window.matchMedia('(prefers-color-scheme: light)').matches;
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
